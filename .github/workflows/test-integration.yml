name: Test Workflow Integration

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read
  actions: read

jobs:
  vitest:
    name: Exercise Vitest Workflow
    uses: ./.github/workflows/testlanes.yml
    with:
      framework: vitest
      working-directory: fixtures/vitest
      install-command: npm ci --prefix ../.. && npm ci
      shards: 2
      artifact-prefix: integration-vitest

  jest:
    name: Exercise Jest Workflow
    uses: ./.github/workflows/testlanes.yml
    with:
      framework: jest
      working-directory: fixtures/jest
      install-command: npm ci --prefix ../.. && npm ci
      shards: 3
      test-args: '["--ci"]'
      artifact-prefix: integration-jest

  node:
    name: Exercise node:test Workflow
    uses: ./.github/workflows/testlanes.yml
    with:
      framework: node
      working-directory: fixtures/node
      install-command: npm ci --prefix ../.. && npm ci
      shards: 2
      test-args: '["--test-concurrency=1"]'
      artifact-prefix: integration-node
      test-wrapper: '["c8","--reporter=lcov"]'
      artifacts: fixtures/node/coverage/lcov.info

  node-artifacts:
    name: Check node:test Shard Artifacts
    needs: node
    runs-on: ubuntu-latest
    steps:
      - name: Download Shard Artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: integration-node-artifacts-*
          path: artifacts
      - name: Check One Coverage Report per Shard
        run: test "$(find artifacts -name lcov.info | wc -l)" -eq 2

  pnpm:
    name: Exercise pnpm Project
    uses: ./.github/workflows/testlanes.yml
    with:
      framework: node
      working-directory: fixtures/pnpm
      setup: test -d node_modules/.pnpm
      shards: 2
      artifact-prefix: integration-pnpm

  configuration:
    name: Exercise Configuration (${{ matrix.entry.framework }}, ${{ matrix.entry.kernel }})
    strategy:
      fail-fast: false
      matrix:
        entry:
          - { framework: vitest, runner: macos-latest, kernel: Darwin, pattern: 'specs/*.spec.js' }
          - { framework: jest, runner: '["ubuntu-latest"]', kernel: Linux, pattern: '' }
    uses: ./.github/workflows/testlanes.yml
    with:
      framework: ${{ matrix.entry.framework }}
      runs-on: ${{ matrix.entry.runner }}
      timeout-minutes: 15
      max-parallel: 1
      fail-fast: true
      install-node-version: '26.13.1'
      node-version: '24.22.3'
      working-directory: fixtures/${{ matrix.entry.framework }}
      install-command: npm ci --prefix ../.. && npm ci
      setup: test "$(uname -s)" = "${{ matrix.entry.kernel }}" && test "$(node --version)" = v24.22.3
      group-by: filesize
      shards: 2
      pattern: ${{ matrix.entry.pattern }}
      artifact-prefix: integration-configuration-${{ matrix.entry.framework }}-${{ matrix.entry.kernel }}
      artifact-retention-days: 1
      timings-retention-days: 1

  windows:
    name: Exercise Windows (${{ matrix.entry.framework }})
    strategy:
      fail-fast: false
      matrix:
        entry:
          - { framework: vitest }
          - { framework: jest }
          - { framework: node }
    uses: ./.github/workflows/testlanes.yml
    with:
      framework: ${{ matrix.entry.framework }}
      runs-on: windows-latest
      working-directory: fixtures/${{ matrix.entry.framework }}
      install-command: npm ci --prefix ../.. && npm ci
      setup: if ($env:OS -ne 'Windows_NT') { exit 1 }
      shards: 2
      artifact-prefix: integration-windows-${{ matrix.entry.framework }}

  standalone-plan:
    name: Plan With Standalone Action
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Check Out Code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set Up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install Dependencies
        run: npm ci && npm ci --prefix fixtures/vitest
      - name: Write Fixture Timings
        run: printf '{"specs/alpha.spec.js":4,"specs/bravo.spec.js":3,"specs/charlie.spec.js":1}\n' > fixtures/vitest/timings.json
      - name: Plan Shards
        id: plan
        uses: ./
        with:
          working-directory: fixtures/vitest
          shards: '2'
          group-by: runtime
          timings: timings.json
      - name: Check Selected Grouping
        env:
          GROUP_BY: ${{ steps.plan.outputs.group-by }}
        run: test "$GROUP_BY" = runtime
      - name: Check Assigned Files
        env:
          MATRIX: ${{ steps.plan.outputs.matrix }}
        run: >-
          node -e 'const files = JSON.parse(process.env.MATRIX).flatMap((entry) => entry.files).sort();
          const expected = ["specs/alpha.spec.js", "specs/bravo.spec.js", "specs/charlie.spec.js", "specs/delta.spec.js", "specs/nested/echo.spec.js"];
          if (JSON.stringify(files) !== JSON.stringify(expected)) throw new Error("Unexpected assigned files: " + files + ".");'

  standalone-run:
    name: Run Standalone Shard ${{ matrix.entry.shard }}
    needs: standalone-plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJSON(needs.standalone-plan.outputs.matrix) }}
    steps:
      - name: Check Out Code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set Up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install Dependencies
        run: npm ci && npm ci --prefix fixtures/vitest
      - name: Run Assigned Tests
        working-directory: fixtures/vitest
        env:
          FILES: ${{ join(matrix.entry.files, ' ') }}
        run: |
          read -r -a files <<< "$FILES"
          npx vitest run "${files[@]}"
