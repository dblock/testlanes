name: testlanes

on:
  workflow_call:
    inputs:
      framework:
        description: Test framework, either vitest, jest, or node.
        type: string
        required: true
      runs-on:
        description: Runner label or JSON array of labels for every job (Linux, macOS, or Windows).
        type: string
        default: ubuntu-latest
      timeout-minutes:
        description: Positive integer timeout for each job.
        type: number
        default: 360
      max-parallel:
        description: Maximum concurrent workers (1-256), subject to runner availability.
        type: number
        default: 256
      fail-fast:
        description: Cancel queued and running workers when a worker fails.
        type: boolean
        default: false
      install-node-version:
        description: Node.js version for installing dependencies, planning, and collecting timings (empty uses the test Node.js).
        type: string
        default: ''
      node-version:
        description: Node.js version (empty reads .nvmrc, .node-version, or package.json in the working directory).
        type: string
        default: ''
      working-directory:
        description: Directory containing the project's package.json, relative to the repository root.
        type: string
        default: .
      install-command:
        description: Shell command installing dependencies (empty detects npm, pnpm, or Yarn from the lockfile).
        type: string
        default: ''
      setup:
        description: Shell setup after installing dependencies in each test shard.
        type: string
        default: ''
      shards:
        description: Number of test shards (1-256), capped at the number of test files.
        type: number
        default: 4
      group-by:
        description: Group by auto, filesize, or runtime.
        type: string
        default: auto
      pattern:
        description: Glob selecting test files relative to the working directory (empty uses the framework's own listing).
        type: string
        default: ''
      test-args:
        description: JSON array of additional framework arguments used for listing and running tests.
        type: string
        default: '[]'
      test-wrapper:
        description: JSON array of a command and arguments that wrap each shard's test run, such as c8 for coverage.
        type: string
        default: '[]'
      artifacts:
        description: Paths relative to the repository root uploaded from every shard as <artifact-prefix>-artifacts-<shard>, such as coverage reports.
        type: string
        default: ''
      artifact-prefix:
        description: Unique artifact name prefix when calling this workflow more than once.
        type: string
        default: testlanes
      artifact-retention-days:
        description: Retention for shard results (0 uses repository default).
        type: number
        default: 30
      timings-retention-days:
        description: Retention for trusted timing history (0 uses repository default).
        type: number
        default: 90

permissions:
  contents: read
  actions: read

jobs:
  matrix:
    name: Shard Matrix
    runs-on: ${{ startsWith(inputs.runs-on, '[') && fromJSON(inputs.runs-on) || inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      history-run: ${{ steps.history.outputs.history-run }}
      history-artifact: ${{ steps.history.outputs.history-artifact }}
    steps:
      - name: List Shards
        id: matrix
        # Shards plan for themselves, so this job only lists them, without checkout or Node.js.
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SHARDS: ${{ inputs.shards }}
        with:
          script: |
            const count = Number(process.env.SHARDS);
            if (!Number.isInteger(count) || count < 1 || count > 256) throw new Error("shards must be an integer from 1 to 256.");
            const matrix = Array.from({ length: count }, (_, index) => ({ shard: index + 1, name: `${index + 1} of ${count}` }));
            core.setOutput("matrix", JSON.stringify(matrix));
      - name: Find Trusted History
        id: history
        if: inputs.group-by != 'filesize'
        # One lookup per run, so every shard plans from the same baseline; failures are warnings.
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ARTIFACT_PREFIX: ${{ inputs.artifact-prefix }}
        with:
          script: |
            const name = `${process.env.ARTIFACT_PREFIX}-timings`;
            const branch = context.payload.repository?.default_branch;
            const { owner, repo } = context.repo;
            try {
              const { data: current } = await github.rest.actions.getWorkflowRun({ owner, repo, run_id: context.runId });
              const { data: { workflow_runs: runs } } = await github.rest.actions.listWorkflowRuns({ owner, repo, workflow_id: current.workflow_id, branch, event: "push", status: "success", per_page: 20 });
              for (const run of runs) {
                // Only successful same-repository default-branch push runs supply baselines.
                if (run.id === current.id || run.event !== "push" || run.conclusion !== "success" || run.head_branch !== branch || run.head_repository?.full_name !== `${owner}/${repo}`) continue;
                const { data: { artifacts } } = await github.rest.actions.listWorkflowRunArtifacts({ owner, repo, run_id: run.id, name, per_page: 100 });
                const artifact = artifacts.find((entry) => entry.name === name && !entry.expired);
                if (artifact) {
                  core.setOutput("history-run", String(run.id));
                  core.setOutput("history-artifact", String(artifact.id));
                  core.info(`Found timing history in run ${run.id}.`);
                  return;
                }
              }
              core.info("No trusted timing history was found.");
            } catch (error) {
              core.warning(`Timing history unavailable: ${error.message}`);
            }

  test:
    name: ${{ matrix.entry.name }}
    needs: matrix
    runs-on: ${{ startsWith(inputs.runs-on, '[') && fromJSON(inputs.runs-on) || inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    strategy:
      fail-fast: ${{ inputs.fail-fast }}
      max-parallel: ${{ inputs.max-parallel }}
      matrix:
        entry: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    steps:
      - &checkout
        name: Check Out Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - &detect
        name: Detect Package Manager
        id: tools
        # Runs on the Actions runner's own Node.js, so runners need no Node.js before Set Up Node.
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
        with:
          script: |
            const fs = require("fs");
            const path = require("path");
            const directory = process.env.WORKING_DIRECTORY;
            const has = (file) => fs.existsSync(path.join(directory, file));
            let manager = has("pnpm-lock.yaml") ? "pnpm" : has("yarn.lock") ? "yarn" : "npm";
            try {
              const declared = String(JSON.parse(fs.readFileSync(path.join(directory, "package.json"), "utf8")).packageManager || "").split("@")[0];
              if (["npm", "pnpm", "yarn"].includes(declared)) manager = declared;
            } catch {}
            const versionFile = [".nvmrc", ".node-version", "package.json"].find(has);
            const values = {
              "package-manager": manager,
              lockfile: { npm: "package-lock.json", pnpm: "pnpm-lock.yaml", yarn: "yarn.lock" }[manager],
              install: {
                npm: "npm ci",
                pnpm: "pnpm install --frozen-lockfile",
                yarn: has(".yarnrc.yml") ? "yarn install --immutable" : "yarn install --frozen-lockfile",
              }[manager],
              "node-version-file": versionFile ? `${directory}/${versionFile}` : "",
            };
            // Job outputs for the Test and Collect jobs, and environment variables for this job's later steps.
            for (const [key, value] of Object.entries(values)) {
              core.setOutput(key, value);
              core.exportVariable(`TESTLANES_${key.toUpperCase().replaceAll("-", "_")}`, value);
            }
      - &setup-node
        name: Set Up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.install-node-version || inputs.node-version }}
          node-version-file: ${{ inputs.install-node-version == '' && inputs.node-version == '' && env.TESTLANES_NODE_VERSION_FILE || '' }}
          cache: ${{ env.TESTLANES_PACKAGE_MANAGER == 'npm' && 'npm' || '' }}
          cache-dependency-path: ${{ inputs.working-directory }}/${{ env.TESTLANES_LOCKFILE }}
      - &enable-corepack
        name: Enable Corepack
        if: env.TESTLANES_PACKAGE_MANAGER != 'npm'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await exec.exec("npm", ["install", "--global", "corepack@0.36.0"]);
            await exec.exec("corepack", ["enable"]);
      - &install
        name: Install Dependencies
        if: inputs.install-command == ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
        with:
          script: |
            const [command, ...args] = process.env.TESTLANES_INSTALL.split(" ");
            await exec.exec(command, args, { cwd: process.env.WORKING_DIRECTORY });
      - &install-command
        name: Run Install Command
        if: inputs.install-command != ''
        working-directory: ${{ inputs.working-directory }}
        # The caller's command, run with the runner's default shell: Bash, or PowerShell on Windows.
        run: ${{ inputs.install-command }}
      - name: Set Up Test Node
        if: inputs.install-node-version != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          node-version-file: ${{ inputs.node-version == '' && env.TESTLANES_NODE_VERSION_FILE || '' }}
          package-manager-cache: false
      - name: Set Up Application
        if: inputs.setup != ''
        working-directory: ${{ inputs.working-directory }}
        # The caller's script, run with the runner's default shell: Bash, or PowerShell on Windows.
        run: ${{ inputs.setup }}
      - name: Restore History
        if: needs.matrix.outputs.history-artifact != ''
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.matrix.outputs.history-artifact }}
          run-id: ${{ needs.matrix.outputs.history-run }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ runner.temp }}/testlanes/history
      - name: Plan and Run Assigned Tests
        id: run
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TESTLANES_INPUTS: ${{ toJSON(inputs) }}
          TESTLANES_SHARD: ${{ matrix.entry.shard }}
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
        with:
          script: |
            await exec.exec("npx", ["--no-install", "testlanes", "github", "run"], { cwd: process.env.WORKING_DIRECTORY });
      - name: Upload Measurements
        if: steps.run.outputs.artifact != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.run.outputs.artifact }}
          path: ${{ runner.temp }}/testlanes/result/
          if-no-files-found: error
          retention-days: ${{ inputs.artifact-retention-days }}
      - name: Upload Test Artifacts
        if: always() && inputs.artifacts != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-prefix }}-artifacts-${{ matrix.entry.shard }}
          path: ${{ inputs.artifacts }}
          include-hidden-files: true
          if-no-files-found: ignore
          overwrite: true
          retention-days: ${{ inputs.artifact-retention-days }}


  verify:
    name: Verify Shards
    needs: test
    runs-on: ${{ startsWith(inputs.runs-on, '[') && fromJSON(inputs.runs-on) || inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - &download-results
        name: Download Shard Results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ inputs.artifact-prefix }}-shard-*
          path: ${{ runner.temp }}/testlanes/results
      - name: Check Shards Used One Plan
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RESULTS: ${{ runner.temp }}/testlanes/results
        with:
          script: |
            const fs = require("fs");
            const path = require("path");
            const directory = process.env.RESULTS;
            const reports = fs.existsSync(directory)
              ? fs.readdirSync(directory, { recursive: true }).filter((entry) => path.basename(entry) === "result.json")
                .map((entry) => JSON.parse(fs.readFileSync(path.join(directory, entry), "utf8")))
              : [];
            // Each shard's newest attempt counts, so re-running all jobs replaces earlier plans.
            const newest = new Map();
            for (const report of reports) {
              if (!newest.has(report.shard) || newest.get(report.shard).attempt < report.attempt) newest.set(report.shard, report);
            }
            const plans = new Set([...newest.values()].map((report) => report.plan));
            if (plans.size > 1) {
              throw new Error(`Shards planned differently (${plans.size} plan fingerprints), because the timing baseline changed or could not be downloaded for some shards; re-run all jobs.`);
            }
            const expected = Math.max(0, ...[...newest.values()].map((report) => report.shards));
            const shards = new Set(newest.keys());
            const missing = Array.from({ length: expected }, (_, index) => index + 1).filter((shard) => !shards.has(shard));
            if (missing.length > 0) throw new Error(`No results from shards ${missing.join(", ")}.`);
            core.info(`${shards.size} shards used one plan.`);

  collect:
    name: Collect Timings
    needs: [test, verify]
    # Only default-branch pushes publish timings; other runs skip this job.
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ${{ startsWith(inputs.runs-on, '[') && fromJSON(inputs.runs-on) || inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - *checkout
      - *detect
      - *setup-node
      - *enable-corepack
      - *install
      - *install-command
      - *download-results
      - name: Validate and Combine Measurements
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TESTLANES_INPUTS: ${{ toJSON(inputs) }}
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
        with:
          script: |
            await exec.exec("npx", ["--no-install", "testlanes", "github", "collect"], { cwd: process.env.WORKING_DIRECTORY });
      - name: Publish Trusted Baseline
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-prefix }}-timings
          path: ${{ runner.temp }}/testlanes/baseline/timings.json
          if-no-files-found: error
          overwrite: true
          retention-days: ${{ inputs.timings-retention-days }}
