name: testlanes

on:
  workflow_call:
    inputs:
      framework:
        description: Test framework, either vitest, jest, or node.
        type: string
        required: true
      runs-on:
        description: Runner label or JSON array of labels for every job (Linux or macOS).
        type: string
        default: ubuntu-latest
      timeout-minutes:
        description: Positive integer timeout for each preparation, worker, and collection job.
        type: number
        default: 360
      max-parallel:
        description: Maximum concurrent workers (1-256), subject to runner availability.
        type: number
        default: 256
      fail-fast:
        description: Cancel queued and running workers when a worker fails.
        type: boolean
        default: false
      node-version:
        description: Node.js version (empty reads .nvmrc, .node-version, or package.json in the working directory).
        type: string
        default: ''
      working-directory:
        description: Directory containing the project's package.json, relative to the repository root.
        type: string
        default: .
      install-command:
        description: Shell command installing dependencies (empty detects npm, pnpm, or Yarn from the lockfile).
        type: string
        default: ''
      setup:
        description: Shell setup after installing dependencies in each test shard.
        type: string
        default: ''
      shards:
        description: Number of test shards (1-256), capped at the number of test files.
        type: number
        default: 4
      group-by:
        description: Group by auto, filesize, or runtime.
        type: string
        default: auto
      pattern:
        description: Glob selecting test files relative to the working directory (empty uses the framework's own listing).
        type: string
        default: ''
      test-args:
        description: JSON array of additional framework arguments used for listing and running tests.
        type: string
        default: '[]'
      artifact-prefix:
        description: Unique artifact name prefix when calling this workflow more than once.
        type: string
        default: testlanes
      artifact-retention-days:
        description: Retention for plans and shard results (0 uses repository default).
        type: number
        default: 30
      timings-retention-days:
        description: Retention for trusted timing history (0 uses repository default).
        type: number
        default: 90

permissions:
  contents: read
  actions: read

env:
  # Updated by each release so plans fail when the caller's package version differs.
  TESTLANES_VERSION: 0.1.1

jobs:
  prepare:
    name: Prepare Shards
    runs-on: ${{ startsWith(inputs.runs-on, '[') && fromJSON(inputs.runs-on) || inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      artifact: ${{ steps.plan.outputs.artifact }}
    steps:
      - name: Check Out Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Detect Package Manager
        id: tools
        working-directory: ${{ inputs.working-directory }}
        run: |
          manager=npm
          lockfile=package-lock.json
          if [ -f pnpm-lock.yaml ]; then manager=pnpm; lockfile=pnpm-lock.yaml; elif [ -f yarn.lock ]; then manager=yarn; lockfile=yarn.lock; fi
          declared=$(node -p "try { String(require('./package.json').packageManager || '').split('@')[0] } catch { '' }")
          case "$declared" in npm|pnpm|yarn) manager=$declared ;; esac
          case "$manager" in
            pnpm) install='pnpm install --frozen-lockfile' ;;
            yarn) if [ -f .yarnrc.yml ]; then install='yarn install --immutable'; else install='yarn install --frozen-lockfile'; fi ;;
            *) install='npm ci' ;;
          esac
          version_file=
          for candidate in .nvmrc .node-version package.json; do
            if [ -f "$candidate" ]; then version_file="$candidate"; break; fi
          done
          {
            echo "manager=$manager"
            echo "lockfile=$lockfile"
            echo "install=$install"
            echo "version-file=${version_file:+$WORKING_DIRECTORY/$version_file}"
          } >> "$GITHUB_OUTPUT"
        env:
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
      - name: Set Up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          node-version-file: ${{ inputs.node-version == '' && steps.tools.outputs.version-file || '' }}
          cache: ${{ steps.tools.outputs.manager == 'npm' && 'npm' || '' }}
          cache-dependency-path: ${{ inputs.working-directory }}/${{ steps.tools.outputs.lockfile }}
      - name: Enable Corepack
        if: steps.tools.outputs.manager != 'npm'
        run: npm install --global corepack@0.36.0 && corepack enable
      - name: Cache Package Manager Store
        if: steps.tools.outputs.manager != 'npm'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          node-version-file: ${{ inputs.node-version == '' && steps.tools.outputs.version-file || '' }}
          cache: ${{ steps.tools.outputs.manager }}
          cache-dependency-path: ${{ inputs.working-directory }}/${{ steps.tools.outputs.lockfile }}
      - name: Install Dependencies
        working-directory: ${{ inputs.working-directory }}
        env:
          INSTALL_COMMAND: ${{ inputs.install-command || steps.tools.outputs.install }}
        run: bash -eo pipefail -c "$INSTALL_COMMAND"
      - name: Find Trusted History
        id: history
        if: inputs.group-by != 'filesize'
        working-directory: ${{ inputs.working-directory }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PREFIX: ${{ inputs.artifact-prefix }}
        run: npx --no-install testlanes history --prefix "$PREFIX"
      - name: Restore History
        if: steps.history.outputs.history-artifact != ''
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.history.outputs.history-artifact }}
          run-id: ${{ steps.history.outputs.history-run }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ runner.temp }}/testlanes/history
      - name: Prepare Shared Plan
        id: plan
        working-directory: ${{ inputs.working-directory }}
        env:
          FRAMEWORK: ${{ inputs.framework }}
          SHARDS: ${{ inputs.shards }}
          GROUP_BY: ${{ inputs.group-by }}
          PATTERN: ${{ inputs.pattern }}
          TEST_ARGS: ${{ inputs.test-args }}
          PREFIX: ${{ inputs.artifact-prefix }}
        run: |
          if ! [[ "$PREFIX" =~ ^[A-Za-z0-9][A-Za-z0-9_-]*$ ]]; then
            echo "Artifact prefix must contain only letters, numbers, underscores, and hyphens." >&2
            exit 1
          fi
          npx --no-install testlanes plan --framework "$FRAMEWORK" --shards "$SHARDS" --group-by "$GROUP_BY" \
            --pattern "$PATTERN" --test-args "$TEST_ARGS" --timings "$RUNNER_TEMP/testlanes/history/timings.json" \
            --out "$RUNNER_TEMP/testlanes/plan" --matrix workers --expect-version "$TESTLANES_VERSION"
          echo "artifact=$PREFIX-plan-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Share Immutable Plan
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.plan.outputs.artifact }}
          path: ${{ runner.temp }}/testlanes/plan/
          if-no-files-found: error
          retention-days: ${{ inputs.artifact-retention-days }}

  test:
    name: ${{ matrix.entry.name }}
    needs: prepare
    runs-on: ${{ startsWith(inputs.runs-on, '[') && fromJSON(inputs.runs-on) || inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    strategy:
      fail-fast: ${{ inputs.fail-fast }}
      max-parallel: ${{ inputs.max-parallel }}
      matrix:
        entry: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Check Out Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Detect Package Manager
        id: tools
        working-directory: ${{ inputs.working-directory }}
        run: |
          manager=npm
          lockfile=package-lock.json
          if [ -f pnpm-lock.yaml ]; then manager=pnpm; lockfile=pnpm-lock.yaml; elif [ -f yarn.lock ]; then manager=yarn; lockfile=yarn.lock; fi
          declared=$(node -p "try { String(require('./package.json').packageManager || '').split('@')[0] } catch { '' }")
          case "$declared" in npm|pnpm|yarn) manager=$declared ;; esac
          case "$manager" in
            pnpm) install='pnpm install --frozen-lockfile' ;;
            yarn) if [ -f .yarnrc.yml ]; then install='yarn install --immutable'; else install='yarn install --frozen-lockfile'; fi ;;
            *) install='npm ci' ;;
          esac
          version_file=
          for candidate in .nvmrc .node-version package.json; do
            if [ -f "$candidate" ]; then version_file="$candidate"; break; fi
          done
          {
            echo "manager=$manager"
            echo "lockfile=$lockfile"
            echo "install=$install"
            echo "version-file=${version_file:+$WORKING_DIRECTORY/$version_file}"
          } >> "$GITHUB_OUTPUT"
        env:
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
      - name: Set Up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          node-version-file: ${{ inputs.node-version == '' && steps.tools.outputs.version-file || '' }}
          cache: ${{ steps.tools.outputs.manager == 'npm' && 'npm' || '' }}
          cache-dependency-path: ${{ inputs.working-directory }}/${{ steps.tools.outputs.lockfile }}
      - name: Enable Corepack
        if: steps.tools.outputs.manager != 'npm'
        run: npm install --global corepack@0.36.0 && corepack enable
      - name: Cache Package Manager Store
        if: steps.tools.outputs.manager != 'npm'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          node-version-file: ${{ inputs.node-version == '' && steps.tools.outputs.version-file || '' }}
          cache: ${{ steps.tools.outputs.manager }}
          cache-dependency-path: ${{ inputs.working-directory }}/${{ steps.tools.outputs.lockfile }}
      - name: Install Dependencies
        working-directory: ${{ inputs.working-directory }}
        env:
          INSTALL_COMMAND: ${{ inputs.install-command || steps.tools.outputs.install }}
        run: bash -eo pipefail -c "$INSTALL_COMMAND"
      - name: Download Shared Plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.prepare.outputs.artifact }}
          path: ${{ runner.temp }}/testlanes/plan
      - name: Set Up Application
        if: inputs.setup != ''
        working-directory: ${{ inputs.working-directory }}
        env:
          SETUP_SCRIPT: ${{ inputs.setup }}
        run: bash -eo pipefail -c "$SETUP_SCRIPT"
      - name: Run Assigned Tests
        id: run
        working-directory: ${{ inputs.working-directory }}
        env:
          SHARD: ${{ matrix.entry.shard }}
          PREFIX: ${{ inputs.artifact-prefix }}
        run: |
          npx --no-install testlanes run --plan "$RUNNER_TEMP/testlanes/plan" --shard "$SHARD" --out "$RUNNER_TEMP/testlanes/result"
          echo "artifact=$PREFIX-shard-$SHARD-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Upload Measurements
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.run.outputs.artifact }}
          path: ${{ runner.temp }}/testlanes/result/
          if-no-files-found: error
          retention-days: ${{ inputs.artifact-retention-days }}

  collect:
    name: Collect Timings
    needs: [prepare, test]
    runs-on: ${{ startsWith(inputs.runs-on, '[') && fromJSON(inputs.runs-on) || inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - name: Check Out Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Detect Package Manager
        id: tools
        working-directory: ${{ inputs.working-directory }}
        run: |
          manager=npm
          lockfile=package-lock.json
          if [ -f pnpm-lock.yaml ]; then manager=pnpm; lockfile=pnpm-lock.yaml; elif [ -f yarn.lock ]; then manager=yarn; lockfile=yarn.lock; fi
          declared=$(node -p "try { String(require('./package.json').packageManager || '').split('@')[0] } catch { '' }")
          case "$declared" in npm|pnpm|yarn) manager=$declared ;; esac
          case "$manager" in
            pnpm) install='pnpm install --frozen-lockfile' ;;
            yarn) if [ -f .yarnrc.yml ]; then install='yarn install --immutable'; else install='yarn install --frozen-lockfile'; fi ;;
            *) install='npm ci' ;;
          esac
          version_file=
          for candidate in .nvmrc .node-version package.json; do
            if [ -f "$candidate" ]; then version_file="$candidate"; break; fi
          done
          {
            echo "manager=$manager"
            echo "lockfile=$lockfile"
            echo "install=$install"
            echo "version-file=${version_file:+$WORKING_DIRECTORY/$version_file}"
          } >> "$GITHUB_OUTPUT"
        env:
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
      - name: Set Up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          node-version-file: ${{ inputs.node-version == '' && steps.tools.outputs.version-file || '' }}
          cache: ${{ steps.tools.outputs.manager == 'npm' && 'npm' || '' }}
          cache-dependency-path: ${{ inputs.working-directory }}/${{ steps.tools.outputs.lockfile }}
      - name: Enable Corepack
        if: steps.tools.outputs.manager != 'npm'
        run: npm install --global corepack@0.36.0 && corepack enable
      - name: Cache Package Manager Store
        if: steps.tools.outputs.manager != 'npm'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          node-version-file: ${{ inputs.node-version == '' && steps.tools.outputs.version-file || '' }}
          cache: ${{ steps.tools.outputs.manager }}
          cache-dependency-path: ${{ inputs.working-directory }}/${{ steps.tools.outputs.lockfile }}
      - name: Install Dependencies
        working-directory: ${{ inputs.working-directory }}
        env:
          INSTALL_COMMAND: ${{ inputs.install-command || steps.tools.outputs.install }}
        run: bash -eo pipefail -c "$INSTALL_COMMAND"
      - name: Download Shared Plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.prepare.outputs.artifact }}
          path: ${{ runner.temp }}/testlanes/plan
      - name: Download Measurements
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ inputs.artifact-prefix }}-shard-*
          path: ${{ runner.temp }}/testlanes/results
      - name: Validate and Combine Measurements
        working-directory: ${{ inputs.working-directory }}
        run: npx --no-install testlanes collect --plan "$RUNNER_TEMP/testlanes/plan" --results "$RUNNER_TEMP/testlanes/results" --out "$RUNNER_TEMP/testlanes/baseline/timings.json"
      - name: Publish Trusted Baseline
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-prefix }}-timings
          path: ${{ runner.temp }}/testlanes/baseline/timings.json
          if-no-files-found: error
          overwrite: true
          retention-days: ${{ inputs.timings-retention-days }}
