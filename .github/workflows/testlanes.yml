name: testlanes

on:
  workflow_call:
    inputs:
      framework:
        description: Test framework, either vitest, jest, or node.
        type: string
        required: true
      runs-on:
        description: Runner label or JSON array of labels for every job (Linux, macOS, or Windows).
        type: string
        default: ubuntu-latest
      timeout-minutes:
        description: Positive integer timeout for each preparation, worker, and collection job.
        type: number
        default: 360
      max-parallel:
        description: Maximum concurrent workers (1-256), subject to runner availability.
        type: number
        default: 256
      fail-fast:
        description: Cancel queued and running workers when a worker fails.
        type: boolean
        default: false
      install-node-version:
        description: Node.js version for installing dependencies, planning, and collecting timings (empty uses the test Node.js).
        type: string
        default: ''
      node-version:
        description: Node.js version (empty reads .nvmrc, .node-version, or package.json in the working directory).
        type: string
        default: ''
      working-directory:
        description: Directory containing the project's package.json, relative to the repository root.
        type: string
        default: .
      install-command:
        description: Shell command installing dependencies (empty detects npm, pnpm, or Yarn from the lockfile).
        type: string
        default: ''
      setup:
        description: Shell setup after installing dependencies in each test shard.
        type: string
        default: ''
      shards:
        description: Number of test shards (1-256), capped at the number of test files.
        type: number
        default: 4
      group-by:
        description: Group by auto, filesize, or runtime.
        type: string
        default: auto
      pattern:
        description: Glob selecting test files relative to the working directory (empty uses the framework's own listing).
        type: string
        default: ''
      test-args:
        description: JSON array of additional framework arguments used for listing and running tests.
        type: string
        default: '[]'
      test-wrapper:
        description: JSON array of a command and arguments that wrap each shard's test run, such as c8 for coverage.
        type: string
        default: '[]'
      artifacts:
        description: Paths relative to the repository root uploaded from every shard as <artifact-prefix>-artifacts-<shard>, such as coverage reports.
        type: string
        default: ''
      artifact-prefix:
        description: Unique artifact name prefix when calling this workflow more than once.
        type: string
        default: testlanes
      artifact-retention-days:
        description: Retention for plans and shard results (0 uses repository default).
        type: number
        default: 30
      timings-retention-days:
        description: Retention for trusted timing history (0 uses repository default).
        type: number
        default: 90

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    name: Prepare Shards
    runs-on: ${{ startsWith(inputs.runs-on, '[') && fromJSON(inputs.runs-on) || inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      artifact: ${{ steps.plan.outputs.artifact }}
      package-manager: ${{ steps.tools.outputs.package-manager }}
      lockfile: ${{ steps.tools.outputs.lockfile }}
      install: ${{ steps.tools.outputs.install }}
      node-version-file: ${{ steps.tools.outputs.node-version-file }}
    steps:
      - &checkout
        name: Check Out Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Detect Package Manager
        id: tools
        # Runs once, before dependencies are installed, with the Node.js that GitHub-hosted runners provide.
        shell: node {0}
        working-directory: ${{ inputs.working-directory }}
        env:
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
        run: |
          const fs = require("node:fs");
          const has = (file) => fs.existsSync(file);
          let manager = has("pnpm-lock.yaml") ? "pnpm" : has("yarn.lock") ? "yarn" : "npm";
          try {
            const declared = String(JSON.parse(fs.readFileSync("package.json", "utf8")).packageManager || "").split("@")[0];
            if (["npm", "pnpm", "yarn"].includes(declared)) manager = declared;
          } catch {}
          const install = {
            npm: "npm ci",
            pnpm: "pnpm install --frozen-lockfile",
            yarn: has(".yarnrc.yml") ? "yarn install --immutable" : "yarn install --frozen-lockfile",
          }[manager];
          const versionFile = [".nvmrc", ".node-version", "package.json"].find(has);
          const values = {
            "package-manager": manager,
            lockfile: { npm: "package-lock.json", pnpm: "pnpm-lock.yaml", yarn: "yarn.lock" }[manager],
            install,
            "node-version-file": versionFile ? `${process.env.WORKING_DIRECTORY}/${versionFile}` : "",
          };
          const lines = (format) => Object.entries(values).map(([key, value]) => `${format(key)}=${value}\n`).join("");
          // Job outputs for the Test and Collect jobs, and environment variables for this job's later steps.
          fs.appendFileSync(process.env.GITHUB_OUTPUT, lines((key) => key));
          fs.appendFileSync(process.env.GITHUB_ENV, lines((key) => `TESTLANES_${key.toUpperCase().replaceAll("-", "_")}`));
      - &setup-node
        name: Set Up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.install-node-version || inputs.node-version }}
          node-version-file: ${{ inputs.install-node-version == '' && inputs.node-version == '' && env.TESTLANES_NODE_VERSION_FILE || '' }}
          cache: ${{ env.TESTLANES_PACKAGE_MANAGER == 'npm' && 'npm' || '' }}
          cache-dependency-path: ${{ inputs.working-directory }}/${{ env.TESTLANES_LOCKFILE }}
      - &enable-corepack
        name: Enable Corepack
        if: env.TESTLANES_PACKAGE_MANAGER != 'npm'
        run: npm install --global corepack@0.36.0 && corepack enable
      - &cache-store
        name: Cache Package Manager Store
        if: env.TESTLANES_PACKAGE_MANAGER != 'npm'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.install-node-version || inputs.node-version }}
          node-version-file: ${{ inputs.install-node-version == '' && inputs.node-version == '' && env.TESTLANES_NODE_VERSION_FILE || '' }}
          cache: ${{ env.TESTLANES_PACKAGE_MANAGER }}
          cache-dependency-path: ${{ inputs.working-directory }}/${{ env.TESTLANES_LOCKFILE }}
      - &install
        name: Install Dependencies
        working-directory: ${{ inputs.working-directory }}
        # The caller's command, run with the runner's default shell: Bash, or PowerShell on Windows.
        run: ${{ inputs.install-command || env.TESTLANES_INSTALL }}
      - name: Find Trusted History
        id: history
        if: inputs.group-by != 'filesize'
        working-directory: ${{ inputs.working-directory }}
        env:
          TESTLANES_INPUTS: ${{ toJSON(inputs) }}
          GITHUB_TOKEN: ${{ github.token }}
        run: npx --no-install testlanes github history
      - name: Restore History
        if: steps.history.outputs.history-artifact != ''
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.history.outputs.history-artifact }}
          run-id: ${{ steps.history.outputs.history-run }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ runner.temp }}/testlanes/history
      - name: Prepare Shared Plan
        id: plan
        working-directory: ${{ inputs.working-directory }}
        env:
          TESTLANES_INPUTS: ${{ toJSON(inputs) }}
        run: npx --no-install testlanes github prepare
      - name: Share Immutable Plan
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.plan.outputs.artifact }}
          path: ${{ runner.temp }}/testlanes/plan/
          if-no-files-found: error
          retention-days: ${{ inputs.artifact-retention-days }}

  test:
    name: ${{ matrix.entry.name }}
    needs: prepare
    runs-on: ${{ startsWith(inputs.runs-on, '[') && fromJSON(inputs.runs-on) || inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    env:
      TESTLANES_PACKAGE_MANAGER: ${{ needs.prepare.outputs.package-manager }}
      TESTLANES_LOCKFILE: ${{ needs.prepare.outputs.lockfile }}
      TESTLANES_INSTALL: ${{ needs.prepare.outputs.install }}
      TESTLANES_NODE_VERSION_FILE: ${{ needs.prepare.outputs.node-version-file }}
    strategy:
      fail-fast: ${{ inputs.fail-fast }}
      max-parallel: ${{ inputs.max-parallel }}
      matrix:
        entry: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - *checkout
      - *setup-node
      - *enable-corepack
      - *cache-store
      - *install
      - &download-plan
        name: Download Shared Plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.prepare.outputs.artifact }}
          path: ${{ runner.temp }}/testlanes/plan
      - name: Set Up Test Node
        if: inputs.install-node-version != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          node-version-file: ${{ inputs.node-version == '' && env.TESTLANES_NODE_VERSION_FILE || '' }}
          package-manager-cache: false
      - name: Set Up Application
        if: inputs.setup != ''
        working-directory: ${{ inputs.working-directory }}
        # The caller's script, run with the runner's default shell: Bash, or PowerShell on Windows.
        run: ${{ inputs.setup }}
      - name: Run Assigned Tests
        id: run
        working-directory: ${{ inputs.working-directory }}
        env:
          TESTLANES_INPUTS: ${{ toJSON(inputs) }}
          TESTLANES_SHARD: ${{ matrix.entry.shard }}
        run: npx --no-install testlanes github run
      - name: Upload Measurements
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.run.outputs.artifact }}
          path: ${{ runner.temp }}/testlanes/result/
          if-no-files-found: error
          retention-days: ${{ inputs.artifact-retention-days }}
      - name: Upload Test Artifacts
        if: always() && inputs.artifacts != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-prefix }}-artifacts-${{ matrix.entry.shard }}
          path: ${{ inputs.artifacts }}
          include-hidden-files: true
          if-no-files-found: ignore
          overwrite: true
          retention-days: ${{ inputs.artifact-retention-days }}

  collect:
    name: Collect Timings
    needs: [prepare, test]
    runs-on: ${{ startsWith(inputs.runs-on, '[') && fromJSON(inputs.runs-on) || inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    env:
      TESTLANES_PACKAGE_MANAGER: ${{ needs.prepare.outputs.package-manager }}
      TESTLANES_LOCKFILE: ${{ needs.prepare.outputs.lockfile }}
      TESTLANES_INSTALL: ${{ needs.prepare.outputs.install }}
      TESTLANES_NODE_VERSION_FILE: ${{ needs.prepare.outputs.node-version-file }}
    steps:
      - *checkout
      - *setup-node
      - *enable-corepack
      - *cache-store
      - *install
      - *download-plan
      - name: Download Measurements
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ inputs.artifact-prefix }}-shard-*
          path: ${{ runner.temp }}/testlanes/results
      - name: Validate and Combine Measurements
        working-directory: ${{ inputs.working-directory }}
        env:
          TESTLANES_INPUTS: ${{ toJSON(inputs) }}
        run: npx --no-install testlanes github collect
      - name: Publish Trusted Baseline
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-prefix }}-timings
          path: ${{ runner.temp }}/testlanes/baseline/timings.json
          if-no-files-found: error
          overwrite: true
          retention-days: ${{ inputs.timings-retention-days }}
