name: Test

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test on Node ${{ matrix.entry.node }} with Vitest ${{ matrix.entry.vitest }} and Jest ${{ matrix.entry.jest }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        entry:
          - { node: "22.12.0", vitest: "3.2.7", jest: "29.7.0" }
          - { node: "24.22.3", vitest: "4.1.12", jest: "30.5.2" }
          - { node: "26.13.1", vitest: "5.1.2", jest: "30.5.2" }
    steps:
      - name: Check Out Source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set Up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.entry.node }}
          cache: npm
      - name: Install Dependencies
        run: npm ci
      - name: Select Vitest and Jest Versions
        run: npm install --no-save --package-lock=false vitest@${{ matrix.entry.vitest }} jest@${{ matrix.entry.jest }}
      - name: Run Tests
        run: npm test

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Check Out Source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set Up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install Dependencies
        run: npm ci
      - name: Run Tests with Coverage
        run: npm run test:coverage
      - name: Upload Coverage to Coveralls
        uses: coverallsapp/github-action@v2.3.8
        with:
          file: coverage/lcov.info
          format: lcov
