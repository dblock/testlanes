name: testlanes Shard Matrix
description: Assign Vitest, Jest, or node:test files to GitHub Actions matrix jobs using file sizes or past runtimes.
branding:
  icon: grid
  color: green
inputs:
  framework:
    description: Test framework, either vitest, jest, or node.
    default: vitest
  working-directory:
    description: Directory containing the project's package.json.
    default: .
  pattern:
    description: Glob selecting test files relative to the working directory; empty uses the framework's own listing.
    default: ''
  shards:
    description: Maximum number of shards, from 1 to 256.
    default: '4'
  timings:
    description: Optional path to a testlanes timing JSON file, relative to the working directory.
    default: ''
  group-by:
    description: Group by auto, filesize, or runtime.
    default: auto
  test-args:
    description: JSON array of additional framework arguments used for listing tests.
    default: '[]'
outputs:
  matrix:
    description: JSON array of entries with a shard number and its assigned file paths.
    value: ${{ steps.plan.outputs.matrix }}
  group-by:
    description: Grouping method, either filesize or runtime.
    value: ${{ steps.plan.outputs.group-by }}
runs:
  using: composite
  steps:
    - name: Plan Test Shards
      id: plan
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        TESTLANES_INPUTS: ${{ toJSON(inputs) }}
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
      with:
        script: |
          await exec.exec("npx", ["--no-install", "testlanes", "github", "matrix"], { cwd: process.env.WORKING_DIRECTORY });
